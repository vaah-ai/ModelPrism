[project]
name = "modelprism-backend"
version = "0.1.0"
description = "ModelPrism — Open Source GPU Inference Platform (Backend)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "ModelPrism Contributors" },
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic-settings>=2.0",
    "redis[hiredis]>=5.0",
    "prometheus-client>=0.20",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.8",
    "pytest-cov>=4.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
explicit_package_bases = true

# redis.asyncio stub has incomplete type annotations for aclose/disconnect
[[tool.mypy.overrides]]
module = "redis.*"
ignore_errors = true
[[tool.mypy.overrides]]
module = "redis.asyncio"
ignore_errors = true

# SQLAlchemy Table type stubs don't expose .indexes
[[tool.mypy.overrides]]
module = "tests.test_models"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real PostgreSQL and Redis (docker-compose)",
]
